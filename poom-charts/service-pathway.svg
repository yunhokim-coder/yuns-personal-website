<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1040" role="img" aria-labelledby="t"><title id="t">Poom Family service pathway: selection, assessment, planning, three coordinated support areas, case review, and closure.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#698780" stroke-width="1.3"/></marker></defs><g font-family="Arial,sans-serif"><rect x="230" y="15" width="500" height="105" rx="12" fill="#edf3f0" stroke="#a9c3bb"/><text x="480.0" y="48" fill="#29434d" text-anchor="middle" font-size="20" font-weight="700">01 · Family selection &amp; initial assessment</text><text x="480.0" y="77" fill="#47615f" text-anchor="middle" font-size="17">Welfare-center screening; family needs,</text><text x="480.0" y="100" fill="#47615f" text-anchor="middle" font-size="17">home environment, and available support</text><path d="M480 120 V155" fill="none" stroke="#698780" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="155" width="500" height="105" rx="12" fill="#edf3f0" stroke="#a9c3bb"/><text x="480.0" y="188" fill="#29434d" text-anchor="middle" font-size="20" font-weight="700">02 · Assignment &amp; baseline assessment</text><text x="480.0" y="217" fill="#47615f" text-anchor="middle" font-size="17">Planning meeting, coach assignment,</text><text x="480.0" y="240" fill="#47615f" text-anchor="middle" font-size="17">psychological and relational assessment</text><path d="M480 260 V295" fill="none" stroke="#698780" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="295" width="500" height="105" rx="12" fill="#edf3f0" stroke="#a9c3bb"/><text x="480.0" y="328" fill="#29434d" text-anchor="middle" font-size="20" font-weight="700">03 · First case conference &amp; individual plan</text><text x="480.0" y="357" fill="#47615f" text-anchor="middle" font-size="17">Goals for each young person</text><text x="480.0" y="380" fill="#47615f" text-anchor="middle" font-size="17">and session-level service planning</text><path d="M365 400 V440 H155 V480" fill="none" stroke="#698780" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 400 V480" fill="none" stroke="#698780" stroke-width="2" marker-end="url(#arrow)"/><path d="M595 400 V440 H805 V480" fill="none" stroke="#698780" stroke-width="2" marker-end="url(#arrow)"/><rect x="15" y="480" width="280" height="135" rx="12" fill="#edf3f0" stroke="#a9c3bb"/><text x="155.0" y="513" fill="#29434d" text-anchor="middle" font-size="20" font-weight="700">Youth support</text><text x="155.0" y="542" fill="#47615f" text-anchor="middle" font-size="17">Individual home-based</text><text x="155.0" y="565" fill="#47615f" text-anchor="middle" font-size="17">coaching for children</text><text x="155.0" y="588" fill="#47615f" text-anchor="middle" font-size="17">and adolescents</text><rect x="340" y="480" width="280" height="135" rx="12" fill="#edf3f0" stroke="#a9c3bb"/><text x="480.0" y="513" fill="#29434d" text-anchor="middle" font-size="20" font-weight="700">Parents &amp; family</text><text x="480.0" y="542" fill="#47615f" text-anchor="middle" font-size="17">Parent coaching,</text><text x="480.0" y="565" fill="#47615f" text-anchor="middle" font-size="17">parent education,</text><text x="480.0" y="588" fill="#47615f" text-anchor="middle" font-size="17">and family activities</text><rect x="665" y="480" width="280" height="135" rx="12" fill="#edf3f0" stroke="#a9c3bb"/><text x="805.0" y="513" fill="#29434d" text-anchor="middle" font-size="20" font-weight="700">Daily life &amp; community</text><text x="805.0" y="542" fill="#47615f" text-anchor="middle" font-size="17">Practical assistance</text><text x="805.0" y="565" fill="#47615f" text-anchor="middle" font-size="17">and linkage to resources</text><text x="805.0" y="588" fill="#47615f" text-anchor="middle" font-size="17">according to family needs</text><path d="M155 615 V655 H380 V695" fill="none" stroke="#698780" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 615 V695" fill="none" stroke="#698780" stroke-width="2" marker-end="url(#arrow)"/><path d="M805 615 V655 H580 V695" fill="none" stroke="#698780" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="695" width="500" height="105" rx="12" fill="#edf3f0" stroke="#a9c3bb"/><text x="480.0" y="728" fill="#29434d" text-anchor="middle" font-size="20" font-weight="700">04 · Second case conference</text><text x="480.0" y="757" fill="#47615f" text-anchor="middle" font-size="17">Share progress and review</text><text x="480.0" y="780" fill="#47615f" text-anchor="middle" font-size="17">the direction of support</text><path d="M480 800 V840" fill="none" stroke="#698780" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="840" width="500" height="105" rx="12" fill="#edf3f0" stroke="#a9c3bb"/><text x="480.0" y="873" fill="#29434d" text-anchor="middle" font-size="20" font-weight="700">05 · Closure &amp; case evaluation</text><text x="480.0" y="902" fill="#47615f" text-anchor="middle" font-size="17">Post-program assessment</text><text x="480.0" y="925" fill="#47615f" text-anchor="middle" font-size="17">and individual closing reports</text><text x="480" y="992" text-anchor="middle" font-size="16" fill="#637179">Three coordinated support areas, tailored to each family.</text></g></svg>