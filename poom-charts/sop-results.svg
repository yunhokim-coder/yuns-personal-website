<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img" aria-labelledby="t5 d5">
<title id="t5">Poom Family Project 2025: pre–post change and change by family structure</title>
<desc id="d5">Left: self-directedness rose from 3.19 to 3.46 (p = .019); self-efficacy rose from 3.31 to 3.39, not significant (p = .300); n = 46. Right: mean change in self-directedness by family structure and culture: two-parent non-multicultural +0.25, two-parent multicultural −0.32, single-parent non-multicultural +0.46, single-parent multicultural +0.37; family main effect p = .049, n = 41.</desc>
