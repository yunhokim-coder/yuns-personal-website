<title id="t6">Discrimination and hidden identity among minority youth in Korea</title>
<desc id="d6">Left: bi-ethnic adolescents who perceived ethnic discrimination had about 3.8 times the odds of depressive symptoms compared with those who did not (adjusted odds ratio). Right: 62.4% of North Korean–background youth do not reveal their origin (2024).</desc>
<style>.tag{font:700 10.5px Inter,system-ui,sans-serif;letter-spacing:.08em;fill:#265b73}.l{font:600 12.5px Inter,system-ui,sans-serif;fill:#1f2933}.s{font:400 11px Inter,system-ui,sans-serif;fill:#64748b}.big{font:500 30px Georgia,serif}</style>
<rect x="0.5" y="0.5" width="679" height="299" rx="8" fill="#fffdfa" stroke="#ddd8cc"/>
<text class="tag" x="22" y="32">BI-ETHNIC ADOLESCENTS</text><text class="s" x="22" y="48">Odds of depressive symptoms (adjusted)</text>
<text class="l" x="22" y="92">No perceived discrimination</text>
<rect x="22" y="102" width="58" height="26" rx="3" fill="#c9c3b5"/>
<text class="big" x="90" y="125" fill="#8a8270" style="font-size:24px">1.0</text>
<text class="s" x="22" y="146">reference</text>
<text class="l" x="22" y="176">Perceived ethnic discrimination</text>
<rect x="22" y="186" width="220" height="26" rx="3" fill="#a0573d"/>
<text class="big" x="252" y="209" fill="#a0573d" style="font-size:24px">3.8×</text>
<text class="s" x="22" y="230">95% CI 2.9–5.0</text>
<text class="s" x="22" y="262">2012 national survey, n = 4,141</text>
