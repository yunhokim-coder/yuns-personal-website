<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="t4 d4">
<title id="t4">Top achievement, low well-being</title>
<desc id="d4">Achievement: Korean students rank 1st to 2nd in math among OECD countries on PISA 2022. Well-being: 22.3% of Korean 15-year-olds report low life satisfaction versus an OECD average of 17.9%, and 27.7% of middle and high school students reported depressive symptoms in 2024.</desc>
<style>.tag{font:700 11px Inter,system-ui,sans-serif;letter-spacing:.09em}.big{font:500 52px Georgia,serif;fill:#265b73}.s{font:400 13px Inter,system-ui,sans-serif;fill:#64748b}.l{font:600 13.5px Inter,system-ui,sans-serif;fill:#1f2933}.v{font:600 13px Inter,system-ui,sans-serif}</style>
<rect x="0.5" y="0.5" width="359" height="399" rx="8" fill="#fffdfa" stroke="#ddd8cc"/>
<text class="tag" x="24" y="38" fill="#265b73">ACHIEVEMENT</text>
<text class="big" x="24" y="98" style="font-size:44px">1st–2nd</text>
<text class="s" x="24" y="124">in math among OECD countries (PISA 2022)</text>
<line x1="24" y1="148" x2="336" y2="148" stroke="#ddd8cc"/>
<text class="tag" x="24" y="178" fill="#a0573d">WELL-BEING</text>
<text class="l" x="24" y="210">Low life satisfaction</text><text class="s" x="24" y="228" style="font-size:11.5px">age 15, Korea vs. OECD average</text>
<rect x="24" y="242" width="141.2" height="16" rx="3" fill="#a0573d"/>
<text class="v" x="173.2" y="255" fill="#1f2933">22.3%<tspan class="s" style="font-size:11px" dx="6">Korea</tspan></text>
<rect x="24" y="266" width="113.4" height="16" rx="3" fill="#c9c3b5"/>
<text class="v" x="145.4" y="279" fill="#8a8270">17.9%<tspan class="s" style="font-size:11px" dx="6">OECD avg.</tspan></text>
<text class="l" x="24" y="320">Depressive symptoms</text><text class="s" x="24" y="338" style="font-size:11.5px">middle &amp; high school students, 2024</text>
<rect x="24" y="352" width="175.4" height="16" rx="3" fill="#a0573d"/>
<text class="v" x="207.4" y="365" fill="#1f2933">27.7%<tspan class="s" style="font-size:11px" dx="6">Korea</tspan></text>
</svg>