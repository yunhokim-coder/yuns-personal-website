<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="t4 d4">
<title id="t4">Top achievement, low well-being</title>
<desc id="d4">Achievement: Korean students rank 1st to 2nd in math among OECD countries on PISA 2022. Well-being: 22.3% of Korean 15-year-olds report low life satisfaction versus an OECD average of 17.9%, and 27.7% of middle and high school students reported depressive symptoms in 2024.</desc>
<style>.tag{font:700 11px Inter,system-ui,sans-serif;letter-spacing:.09em}.big{font:500 52px Georgia,serif;fill:#265b73}.s{font:400 13px Inter,system-ui,sans-serif;fill:#64748b}.l{font:600 13.5px Inter,system-ui,sans-serif;fill:#1f2933}.v{font:600 13px Inter,system-ui,sans-serif}</style>
<rect x="0.5" y="0.5" width="899" height="229" rx="8" fill="#fffdfa" stroke="#ddd8cc"/>
<text class="tag" x="32" y="48" fill="#265b73">ACHIEVEMENT</text>
<text class="big" x="32" y="125">1st–2nd</text>
<text class="s" x="32" y="154">in math among OECD countries</text>
<text class="s" x="32" y="173">(PISA 2022)</text>
<line x1="290" y1="30" x2="290" y2="200" stroke="#ddd8cc"/>
<text class="tag" x="322" y="48" fill="#a0573d">WELL-BEING</text>
<text class="l" x="322" y="90">Low life satisfaction</text><text class="s" x="322" y="108" style="font-size:11.5px">age 15, Korea vs. OECD average</text>
<rect x="540" y="77" width="193.3" height="16" rx="3" fill="#a0573d"/>
<text class="v" x="741.3" y="90" fill="#1f2933">22.3%<tspan class="s" style="font-size:11px" dx="6">Korea</tspan></text>
<rect x="540" y="101" width="155.1" height="16" rx="3" fill="#c9c3b5"/>
<text class="v" x="703.1" y="114" fill="#8a8270">17.9%<tspan class="s" style="font-size:11px" dx="6">OECD avg.</tspan></text>
<text class="l" x="322" y="182">Depressive symptoms</text><text class="s" x="322" y="200" style="font-size:11.5px">middle &amp; high school students, 2024</text>
<rect x="540" y="169" width="240.1" height="16" rx="3" fill="#a0573d"/>
<text class="v" x="788.1" y="182" fill="#1f2933">27.7%<tspan class="s" style="font-size:11px" dx="6">Korea</tspan></text>
</svg>